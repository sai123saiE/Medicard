{% extends "base.html" %}
{% block title %}{{ 'Edit' if medicine else 'Add' }} Medicine{% endblock %}
{% block content %}

<div class="admin-tabs">
    <a href="{{ url_for('admin_dashboard') }}">Dashboard</a>
    <a href="{{ url_for('admin_medicines') }}" class="active">Medicines</a>
    <a href="{{ url_for('admin_categories') }}">Categories</a>
    <a href="{{ url_for('admin_orders') }}">Orders</a>
    <a href="{{ url_for('admin_users') }}">Users</a>
</div>

<div class="form-card" style="max-width: 600px;">
    <h2 style="margin-bottom: 1.2rem;">{{ 'Edit' if medicine else 'Add New' }} Medicine</h2>
    <form method="post" enctype="multipart/form-data">
        <div class="form-group">
            <label>Medicine Name</label>
            <input type="text" name="name" value="{{ medicine.name if medicine else '' }}" required>
        </div>
        <div class="form-group">
            <label>Description</label>
            <textarea name="description">{{ medicine.description if medicine else '' }}</textarea>
        </div>
        <div class="form-group">
            <label>Manufacturer</label>
            <input type="text" name="manufacturer" value="{{ medicine.manufacturer if medicine else '' }}">
        </div>
        <div class="form-group">
            <label>Price (₹)</label>
            <input type="number" step="0.01" name="price" value="{{ medicine.price if medicine else '' }}" required>
        </div>
        <div class="form-group">
            <label>Stock Quantity</label>
            <input type="number" name="stock" value="{{ medicine.stock if medicine else 0 }}" required>
        </div>
        <div class="form-group">
            <label>Category</label>
            <select name="category_id">
                {% for cat in categories %}
                <option value="{{ cat.id }}" {{ 'selected' if medicine and medicine.category_id == cat.id }}>{{ cat.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group checkbox-group">
            <input type="checkbox" name="requires_prescription" id="rx"
                   {{ 'checked' if medicine and medicine.requires_prescription }}>
            <label for="rx" style="margin:0;">Requires Prescription</label>
        </div>
        <div class="form-group">
            <label>Product Image</label>
            <input type="file" name="image" accept="image/*">
        </div>
        <button type="submit" class="btn btn-primary btn-block">{{ 'Update' if medicine else 'Add' }} Medicine</button>
    </form>
</div>

{% endblock %}
