{% extends "base.html" %}
{% block title %}Error {{ code }}{% endblock %}
{% block content %}
<div class="empty-state">
    <h1 style="font-size: 3rem; color: var(--danger);">{{ code }}</h1>
    <p>{{ message }}</p>
    <a href="{{ url_for('home') }}" class="btn btn-primary" style="margin-top: 1rem;">Go Home</a>
</div>
{% endblock %}
