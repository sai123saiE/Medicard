{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}

<div class="form-card">
    <h2 style="margin-bottom: 1.2rem; text-align:center;">Login to MedCart</h2>
    <form method="post">
        <div class="form-group">
            <label>Email</label>
            <input type="email" name="email" required>
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Login</button>
    </form>
    <p class="form-footer">Don't have an account? <a href="{{ url_for('register') }}">Register here</a></p>
    <p class="form-footer" style="font-size:0.8rem;">Admin demo login: admin@medcart.com / admin123</p>
</div>

{% endblock %}
